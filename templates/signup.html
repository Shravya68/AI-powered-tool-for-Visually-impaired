{% extends "base.html" %}

{% block title %}Sign Up - AI Vision{% endblock %}

{% block content %}
<!-- Animated gradient background -->
<div class="animated-bg"></div>

<!-- Floating blurred blobs -->
<div class="blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<!-- Floating glass shapes -->
<div class="glass-shape glass-shape-1"></div>
<div class="glass-shape glass-shape-2"></div>
<div class="glass-shape glass-shape-3"></div>
<div class="glass-shape glass-shape-4"></div>

<div class="min-h-screen flex flex-col items-center justify-center px-4 py-12" style="position: relative; z-index: 1;">
    <!-- AI Vision Branding - Outside the box -->
    <div class="fade-in text-center mb-8">
        <h1 class="text-6xl font-bold text-white mb-3" style="text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 255, 255, 0.2);">
            AI Vision
        </h1>
        <p class="text-xl text-white font-medium" style="text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);">
            AI-powered Assistive Mobility Tool for Visually Impaired
        </p>
    </div>
    
    <!-- Signup Form Box -->
    <div class="fade-in bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Account</h2>
        
        <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" id="first_name" name="first_name" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                <p class="text-xs text-gray-500 mt-1">Minimum 8 characters</p>
            </div>
            
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>
            
            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-blue-600 hover:to-purple-700 transform hover:scale-105 transition duration-200 shadow-lg">
                Sign Up
            </button>
        </form>
        
        <p class="text-center text-gray-600 mt-6">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-blue-600 hover:text-blue-700 font-semibold">Login</a>
        </p>
    </div>
</div>
{% endblock %}
