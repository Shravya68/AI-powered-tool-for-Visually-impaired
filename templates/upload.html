{% extends "base.html" %}
{% block title %}Upload Video - AI Vision{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

<div class="animated-bg"></div>
<div class="blob-container"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
<div class="glass-shape glass-shape-1"></div><div class="glass-shape glass-shape-2"></div>
<div class="glass-shape glass-shape-3"></div><div class="glass-shape glass-shape-4"></div>

<div class="upload-container fade-in zoom-in" style="position: relative; z-index: 1;">
  <div class="upload-panel">
    <h2 class="upload-title">Upload or Record Video</h2>

    <div class="flex justify-center space-x-4 mb-8 border-b-2 border-gray-200">
      <button id="upload-tab" class="tab-btn px-8 py-4 font-bold text-lg border-b-4 border-indigo-600 text-indigo-600">📁 Upload File</button>
      <button id="record-tab" class="tab-btn px-8 py-4 font-bold text-lg text-gray-600 border-b-4 border-transparent">📹 Record Video</button>
    </div>

    <!-- Upload -->
    <div id="upload-section">
      <div class="drag-drop-zone" id="drop-zone">
        <input type="file" id="video-file-input" accept="video/*" class="hidden">
        <label for="video-file-input" class="cursor-pointer block">
          <div class="upload-icon">📁</div>
          <p class="upload-text">Click to upload or drag and drop</p>
          <p class="upload-hint">MP4, WebM, or other video formats</p>
          <p class="upload-hint text-sm mt-2">Maximum file size: 500MB</p>
        </label>
      </div>

      <div id="file-info" class="hidden mt-6 p-6 bg-gradient-to-r from-blue-50 to-purple-50 rounded-2xl border-2 border-blue-300 shadow-lg">
        <p class="font-bold text-gray-800 text-xl">✓ Selected: <span id="file-name" class="text-indigo-600"></span></p>
        <p class="text-base text-gray-600 mt-2">Size: <span id="file-size" class="font-semibold"></span></p>
      </div>
    </div>

    <!-- Process Button -->
    <button id="process-btn" class="hidden w-full mt-10 bg-gradient-to-r from-green-500 via-blue-600 to-purple-600 text-white py-5 rounded-2xl font-bold text-xl">🚀 Process Video with AI</button>

    <!-- Processing -->
    <div id="processing-state" class="hidden mt-8">
      <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-2xl p-8 border-2 border-blue-300">
        <div class="flex items-center justify-center mb-6"><div class="spinner"></div></div>
        <p class="text-center text-gray-800 font-bold text-xl">Processing your video...</p>
        <p class="text-center text-gray-600 mt-2">This may take a few moments</p>
        <div class="w-full bg-gray-300 rounded-full h-3 mt-6"><div id="progress-bar" class="bg-gradient-to-r from-blue-600 to-purple-600 h-3 rounded-full" style="width: 0%"></div></div>
      </div>
    </div>

    <!-- Results -->
    <div id="results-section" class="hidden mt-8">
      <div class="bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-300 rounded-2xl p-8 shadow-lg">
        <h3 class="text-2xl font-bold text-green-800 mb-6 flex items-center"><span class="text-3xl mr-3">✅</span>Processing Complete!</h3>

        <div class="space-y-6">
          <div>
            <h4 class="font-bold text-gray-800 text-lg mb-3">Processed Video with Audio:</h4>
            <video id="result-video" class="w-full rounded-xl shadow-md" controls playsinline></video>
            <a id="download-video" href="#" download="processed.mp4" class="inline-block mt-3 text-blue-600 font-bold hover:text-blue-800">⬇ Download Video</a>
          </div>
        </div>

        <button id="process-another-btn" class="mt-6 bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:from-blue-600 hover:to-indigo-700">Process Another Video</button>
      </div>
    </div>

    <!-- Error -->
    <div id="error-section" class="hidden mt-8">
      <div class="bg-gradient-to-r from-red-50 to-pink-50 border-2 border-red-300 rounded-2xl p-8 shadow-lg">
        <h3 class="text-2xl font-bold text-red-800 mb-4 flex items-center"><span class="text-3xl mr-3">❌</span>Error</h3>
        <p id="error-message" class="text-red-700 text-lg mb-6"></p>
        <button id="retry-btn" class="bg-gradient-to-r from-red-500 to-pink-600 text-white px-8 py-3 rounded-xl font-bold">🔄 Retry</button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/upload.js') }}?v=2"></script>
{% endblock %}
